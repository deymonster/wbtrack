# Exclude patterns
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "__pypackages__",
    "build",
    "dist",
]

# Line length and indentation (matching Black)
line-length = 88
indent-width = 4

# Python version
target-version = "py311"

[lint]
# Selected rules:
# E - pycodestyle errors
# F - Pyflakes
# I - isort
# N - naming
# W - pycodestyle warnings
# B - flake8-bugbear
# RUF - Ruff-specific rules
select = ["E", "F", "I", "N", "W", "B", "RUF"]
ignore = []

# Fix all possible issues automatically
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[format]
# Double quotes for strings (like Black)
quote-style = "double"

# Space indentation (like Black)
indent-style = "space"

# Trailing commas handling (like Black)
skip-magic-trailing-comma = false

# Auto-detect line endings
line-ending = "auto"