version: '3.8'

networks:
  backend:
    external: true
  proxy:
    external: true

services:
  postgres:
    image: postgres:16.3-alpine
    env_file:
      - .env
    container_name: postgres-wbtrack
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - backend
    ports:
      - "5432:5432"

  redis:
    image: redis:7.0.11
    env_file:
      - .env
    container_name: redis-wbtrack
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - backend

  app:
    build:
      context: /opt/wbtrack/backend
      dockerfile: Dockerfile
    container_name: app-wbtrack
    env_file:
      - .env
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=postgres-wbtrack
      - REDIS_HOST=redis-wbtrack
      - ENVIRONMENT=production
      - REDIS_URL=redis://default:${REDIS_PASSWORD}@redis-wbtrack:6379/0
    depends_on:
      - postgres
      - redis
    ports:
      - "8080:8000"
    networks:
      - backend
      - proxy

  celery-worker:
    build:
      context: /opt/wbtrack/backend
      dockerfile: Dockerfile.celery
    container_name: celery-wbtrack
    env_file:
      - .env
    command: celery -A core.celery_app worker --loglevel=info
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=postgres-wbtrack
      - REDIS_HOST=redis-wbtrack
      - REDIS_URL=redis://default:${REDIS_PASSWORD}@redis-wbtrack:6379/0
      - ENVIRONMENT=production
      - PYTHONPATH=/app
    volumes:
      - redis_data:/app
    depends_on:
      - redis
      - postgres
    networks:
      - backend

volumes:
  postgres_data:
    name: postgres_data_wbtrack
  redis_data:
    name: redis_data_wbtrack