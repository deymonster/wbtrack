version: '3.8'

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
  proxy:
    driver: bridge

services:
  postgres:
    image: postgres:16.3-alpine
    container_name: postgres-wbtrack
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - .docker/postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}',
        ]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - backend
    # Порт доступен только на localhost сервера для SSH-туннелирования
    ports:
      - '127.0.0.1:${POSTGRES_PORT}:5432'

  redis:
    image: redis:7.0.11
    container_name: redis-wbtrack
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    env_file:
      - .env
    volumes:
      - .docker/redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - backend
    # Порт доступен только на localhost сервера для SSH-туннелирования
    ports:
      - '127.0.0.1:6379:6379'
  
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app-wbtrack
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - ENVIRONMENT=production
    depends_on:
      - postgres
      - redis
    networks:
      - backend
      - proxy
    # Порт доступен только на localhost сервера для SSH-туннелирования
    ports:
      - '127.0.0.1:${APP_PORT}:8000'
  
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.celery
    container_name: celery-wbtrack
    command: celery -A core.celery_app worker --loglevel=info
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - REDIS_HOST=redis
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - POSTGRES_HOST=postgres
      - PYTHONPATH=/app
    volumes:
      - .:/app
    depends_on:
      - redis
      - postgres
    networks:
      - backend

  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy-wbtrack
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl
      - ./nginx/auth:/etc/nginx/auth
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
    networks:
      - proxy

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - .docker/portainer-data:/data
    networks:
      - proxy
    # Порт доступен только на localhost сервера для SSH-туннелирования
    ports:
      - "127.0.0.1:9000:9000" 