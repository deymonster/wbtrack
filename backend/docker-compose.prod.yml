version: '3.8'

networks:
  backend:
    external: true
  proxy:
    external: true

services:
  postgres:
    image: postgres:16.3-alpine
    container_name: postgres-wbtrack
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - .docker/postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}',
        ]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - backend
    # Порт доступен только на localhost сервера для SSH-туннелирования
    ports:
      # - '127.0.0.1:${POSTGRES_PORT}:5432'
      - "5432:5432"

  redis:
    image: redis:7.0.11
    container_name: redis-wbtrack
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    env_file:
      - .env
    volumes:
      - .docker/redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - backend
    # Порт доступен только на localhost сервера для SSH-туннелирования
    ports:
      - '127.0.0.1:6379:6379'
  
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app-wbtrack
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres-wbtrack
      - REDIS_HOST=redis-wbtrack
      - ENVIRONMENT=production
    depends_on:
      - postgres
      - redis
    networks:
      - backend
      - proxy
    # Порт доступен только на localhost сервера для SSH-туннелирования
    #ports:
    #  - '127.0.0.1:${APP_PORT}:8000'
  
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.celery
    container_name: celery-wbtrack
    command: celery -A core.celery_app worker --loglevel=info
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - REDIS_HOST=redis-wbtrack  
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis-wbtrack:6379/0
      - POSTGRES_HOST=postgres-wbtrack 
      - PYTHONPATH=/app
    volumes:
      - .:/app
    depends_on:
      - redis
      - postgres
    networks:
      - backend

volumes:
  postgres_data:
  redis_data: